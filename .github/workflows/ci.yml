# 自動守門（雲端門）：每次 push / 開 PR，GitHub 自動跑「校對（typecheck）＋糾察（lint）＋考試（test）」。
# PR 頁面會顯示 ✅/❌——合併前先看到綠勾再合併（AGENTS.md 驗證要求的自動化版）。
#
# ⚠️ 兩個 job 是刻意的：
#   deploy-runtime＝**跟 Render 上線那一顆一模一樣的 Node**（讀 `.node-version`，與 render.yaml 同一份真相）。
#                   以前這裡寫死 `node-version: 24`、render.yaml 釘 22.13.0、開發機 26，
#                   結果「真正上線的那顆 runtime，三道關卡一次都沒測到」。
#   dev-machine   ＝William 本機用的最新版。跑它是為了「只在他機器上壞掉」也能在 PR 就看見。
#
# ⚠️ `dev-machine` 刻意 `continue-on-error: true`：它是**前瞻性的探照燈，不是門**。
#    render.yaml 用 `autoDeployTrigger: checksPass`，任何 required check 紅了就不會自動部署——
#    要是讓「下一個大版本 Node 出了新狀況」擋住部署，連**安全更新**都上不去，那是本末倒置。
#    它紅了要看、要處理，但不該有權力封住上線的路。
#
# ⚠️ **協作欄位閘在隔壁檔** `.github/workflows/collab-fields.yml`，不在這裡。
#    原因是觸發條件不同：這裡的三關看**程式碼**（commit 一動才要重跑），
#    那道閘看**PR 說明**，所以它必須額外訂閱 `edited` 事件。
#    合在一起＝改幾個字的說明就重跑 1300+ 題兩輪（#382 r1 抓到的 High 的副作用）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review 必列：草稿轉正式那一刻要跑一次「真的」——見下方 draft 跳過的不變量
    types: [opened, synchronize, reopened, ready_for_review]

# 省額度①（2026-08-15，Actions 額度月中爆掉的直接教訓）：同一支 PR 連續推時，
# 自動取消還在跑的舊那次——審查 29 輪＝中間 28 次的結果沒人看，白改的考卷不必改完。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-runtime:
    name: 上線用的 Node（.node-version）
    runs-on: ubuntu-latest
    # 省額度②：**草稿 PR 的推送不跑考卷**（job 直接 skipped ≈ 0 分鐘）。
    # 慣例（同日寫入 REVIEW-AND-MERGE.md）：審查期間 PR 掛草稿、審到「通過」才轉正式。
    # ⚠️ 不變量（為什麼這樣不會放水）：GitHub 禁止合併草稿 PR；要合併必先轉正式，
    #    而「轉正式」本身就是 ready_for_review 事件＝當下的 head 會跑一次**真的** CI；
    #    轉正式之後的每次 push 也照跑。所以**能合併的 head 一定跑過真考卷**——
    #    skipped 只發生在（本來就合不了的）草稿狀態。job 級 skip 在分支保護顯示
    #    「skipped」且視同滿足，這正是靠上面那條不變量兜住的。
    #    另（2026-08-15 實測）：Actions 帳務爆掉時 run 仍會建立並以 failure 收場（job 0 steps）
    #    ——不會留下舊的 skipped 綠燈頂著，fail-closed 沒被這個設計削弱。
    # ⚠️ 協作欄位閘（collab-fields.yml）**刻意不套這套**：那道閘的形狀被考題焊死
    #    （「只認一種形狀」——job 級 if 正是它列名封殺的繞法），守的是「沒人能自審自合」
    #    的協作底線；它單次 ≈20 秒、不是成本大頭，留著全程跑。
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: 安裝相依（含 typescript/@types 開發工具）
        run: npm ci
      - name: 校對（型別檢查）
        run: npm run typecheck
      - name: 格式糾察（lint）
        run: npm run lint
      - name: 考試（自動測試）
        run: npm test

  dev-machine:
    name: 開發機的 Node（最新版，前瞻｜不擋部署）
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

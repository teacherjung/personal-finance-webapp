# 雲端三關範本（規矩 E3）——GitHub Actions 版。放到專案的 .github/workflows/ci.yml。
# 三關命令的正本在 settings.json（tools/run-checks.js 讀它），這裡不抄。
# 要在平台上把 job 名設成「必過檢查」而且對管理員一樣生效，否則退化成靠自覺（真考卷閘會讀這個名單）。
# 草稿也跑：不跑的代價是本機都在同一種作業系統，只有雲端才壞的東西會到轉正式那天才第一次現形。
name: CI
on:
  push:
    branches: [main]
  # 轉正式（ready_for_review）不重跑雲端三關（擁有者 2026-10-20 裁「方案 A＋B納入」，取代 10/04 留著它的決定）：
  # 原本留著轉正式那一場，是因為跨PR試合併閘只合開著的PR、不合主幹；現在跨PR試合併閘在主幹於分岔後有新提交時，
  # 也會在本機把「這支＋最新主幹」真合起來跑三關（主幹沒前進就不重跑），省下每支轉正式後無條件重等一場雲端三關的 2〜3 分鐘；
  # 同時真考卷閘（check-checks-really-ran.js）在必過檢查還在跑時會自動輪詢等待，消除合併指令跑兩趟的摩擦。
  # 要補考同一版（例如那一場被取消）：在平台上重跑那一場，或把PR關掉再重開；不要推空提交（版本一變，舊的「通過」就失效）。
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: 三關
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: 三關（照 settings.json 登記的順序）
        run: node tools/run-checks.js

  # ── 專案自己的雲端檢查放在這下面（三關以外的）──
  # 搬家時，把專案原本雲端設定裡、這份範本沒有的 job 原樣搬過來——例如相依套件的安全通報、另一個版本的執行環境。
  # ⚠️ 漏搬不會有任何東西變紅：那一道會靜靜消失，原本會被它擋下的PR照樣合進去（搬家驗屋 09-13 在原專案查到兩道）。
  # 會擋合併或部署的，搬過來之後一樣要在平台上設成必過檢查。

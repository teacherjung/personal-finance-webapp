# Render 部署藍圖（C6）——把「怎麼部署」寫成程式碼，而不是靠記憶點後台按鈕。
#
# 怎麼用：Render Dashboard → New → Blueprint → 連上這個 GitHub repo → 它會讀這個檔。
# 之後每次 push 到 main、**且 GitHub CI 綠了**才自動部署（`autoDeployTrigger: checksPass`）。
#
# ⚠️ **這個檔不含任何祕密**。五個 `sync: false` 的變數要在 Render 後台手動填一次
#（Blueprint 部署時會逐一問你），填法見 `docs/C6-部署與對抗審查-操作手冊.md`。
services:
  - type: web
    name: noteasy
    runtime: node
    # 裁決③：Render 沒有台灣區域，新加坡對台延遲最低（~50ms）
    region: singapore
    # 測試期 Free（15 分鐘沒人用會睡眠、下次開要等 30–60 秒冷啟動）；
    # 正式上線改 starter（US$7/月）——裁決③
    plan: free
    # 只裝執行時相依：typescript/eslint 那些是開發工具，不必上雲（也縮小攻擊面）
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # 裁決④：/health 讓給機器（健康領域頁改 /wellness）
    healthCheckPath: /health
    # 等 GitHub CI 綠了才部署（舊的 `autoDeploy: true` ＝每個 commit 立刻上線，型別錯／考題紅也照上）。
    # ⚠️ 代價講清楚：**沒有任何 check 回報的 commit 不會自動部署**（例如工作流被路徑過濾跳過）。
    #    本專案的 .github/workflows/ci.yml 是 `on: push: branches: [main]`、沒有路徑過濾，
    #    所以每個 main 的 commit 都會有 check——真的需要硬上時，到 Render 後台按 Manual Deploy。
    autoDeployTrigger: checksPass
    # onrender.com 子網域：**有了 custom domain 之後必須關掉**，否則 noteasy-xxxx.onrender.com
    # 仍可直連＝繞過 Cloudflare 的 DDoS／WAF／速率限制，邊緣層等於白裝。
    # ⚠️ 這同時是「限速的來源判定」能不能成立的前提：`app.set('trust proxy', 1)` 取
    #    X-Forwarded-For 的**最後一個**＝前面那層代理實際看到的來源。只要源站可直達，
    #    那個值就變成攻擊者自己填的（見 AGENTS.md 速率限制那一列）。
    # ⚠️ Render 規定：要設 disabled，服務**至少要有一個 custom domain**（沒有就會設定失敗）。
    #    所以 C6 測試期先明寫 enabled（明寫＝以後不會「忘記有這回事」），
    #    C7 指好 DNS 的同一支 PR 裡改成下面註解那三行——`test/deploy-config.test.js` 會盯著兩者一起改。
    renderSubdomainPolicy: enabled
    # C7 要改成：
    #   domains:
    #     - noteasy.com.tw
    #     - www.noteasy.com.tw
    #   renderSubdomainPolicy: disabled
    envVars:
      # 模式開關：只認 "1"（lib/hosted.js）。沒有這個變數＝LOCAL＝本機那一套
      - key: NOTEASY_HOSTED
        value: "1"
      # ⚠️ **這裡刻意不設 NODE_VERSION**。Render 的優先序是
      #    NODE_VERSION 環境變數 > .node-version > .nvmrc > package.json engines，
      #    設了它就會蓋掉 `.node-version`——而 `.node-version` 正是 CI（node-version-file）
      #    讀的同一份檔案。**同一個版號只准有一個地方寫**，否則就會回到
      #    「部署跑 22.13.0、CI 跑 24、開發機跑 26，三關一次都沒測到真正上線的那顆 runtime」。
      #    要換 Node 版本＝改 `.node-version` 一個檔，部署與 CI 一起跟著動。
      # ---- 以下五個在 Render 後台填，絕不把實際值寫進 repo ----
      # Supabase 專案網址，如 https://xxxxxxxx.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Supabase 的 **anon** public key（不是 service_role！service_role 繞過 RLS，
      # 一旦拿它讀寫一般資料，整套租戶隔離就形同虛設——裁決⑥不可退讓）
      - key: SUPABASE_ANON_KEY
        sync: false
      # CSRF Origin 白名單（逗號分隔）。上線前先填 Render 給的網址，
      # DNS 指過去之後再加 https://noteasy.com.tw
      - key: SITE_ORIGIN
        sync: false
      # 機密欄位的主金鑰（C5）：`openssl rand -base64 32` 產生的 32 bytes base64。
      # ⚠️ 掉了＝所有已加密的 IB token 與 PDF 密碼都要重新輸入一次（資料本身不會壞）
      - key: NOTEASY_MASTER_KEY
        sync: false
      # SEC 自動請求的識別資訊，格式「產品名稱 可收信聯絡信箱」。
      # 正式值見 docs/C6-部署與對抗審查-操作手冊.md。
      - key: SEC_USER_AGENT
        sync: false

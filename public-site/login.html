<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜不簡單 NotEasy</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="/"><b>不簡單</b><span>NotEasy</span></a>
  <nav class="site-nav"><a href="/">回首頁</a><a href="/login" class="cta">登入</a></nav>
</div></header>
<main class="site-main">
<div class="narrow"><div class="form-card">
  <h1>登入</h1><p class="sub">使用受邀時設定的信箱與密碼。</p>
  <form>
    <label for="email">電子信箱</label><input id="email" type="email" autocomplete="email" disabled>
    <label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" disabled>
    <button type="button" disabled>登入（即將開放）</button>
  </form>
  <div class="notice">帳號系統即將開放。目前為邀請制：收到邀請信的朋友，屆時請從信中連結完成設定。</div>
</div></div>
</main>
<footer class="site-footer"><div class="inner">
  <span>© 2026 不簡單 NotEasy</span><span>邀請制服務・資料只屬於你</span>
</div></footer>
</body>
</html>
